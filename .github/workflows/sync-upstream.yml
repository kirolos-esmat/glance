name: Sync Upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: false

      - name: Synchronize Fork with Upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          # Configure Git Author and custom merge drivers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

          echo "==> Inspecting repository metadata for ${REPO}..."
          REPO_DATA=$(gh api "repos/${REPO}")
          IS_FORK=$(echo "$REPO_DATA" | jq -r '.fork')

          if [ "$IS_FORK" != "true" ]; then
            echo "::error::Repository ${REPO} is not a fork. Automatic synchronization stopped."
            cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Branch: ${TARGET_BRANCH}

          Status: ERROR

          Repository is not a fork. Automatic synchronization stopped.
          EOF
            exit 1
          fi

          PARENT=$(echo "$REPO_DATA" | jq -r '.parent.full_name')

          echo "Confirmed fork repository: ${REPO}"
          echo "Determined upstream parent repository: ${PARENT}"

          echo "==> Verifying upstream '${TARGET_BRANCH}' branch exists..."
          if ! gh api "repos/${PARENT}/branches/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch '${TARGET_BRANCH}' does not exist on upstream repository ${PARENT}."
            cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Upstream: ${PARENT}
          Branch: ${TARGET_BRANCH}

          Status: ERROR

          Branch '${TARGET_BRANCH}' does not exist in upstream repository ${PARENT}.
          EOF
            exit 1
          fi

          echo "==> Fetching upstream/${TARGET_BRANCH} and tags..."
          if git remote | grep -q "^upstream$"; then
            git remote set-url upstream "https://github.com/${PARENT}.git"
          else
            git remote add upstream "https://github.com/${PARENT}.git"
          fi
          git fetch upstream "${TARGET_BRANCH}" --tags
          git push origin --tags 2>/dev/null || true

          echo "==> Aligning local branch to origin/${TARGET_BRANCH}..."
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

          FORK_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse "upstream/${TARGET_BRANCH}")
          FORK_SHORT=$(git rev-parse --short HEAD)
          UPSTREAM_SHORT=$(git rev-parse --short "upstream/${TARGET_BRANCH}")
          MERGE_BASE=$(git merge-base HEAD "upstream/${TARGET_BRANCH}")

          echo "Fork commit (${TARGET_BRANCH}): ${FORK_SHORT} (${FORK_SHA})"
          echo "Upstream commit (${TARGET_BRANCH}): ${UPSTREAM_SHORT} (${UPSTREAM_SHA})"
          echo "Merge base commit: ${MERGE_BASE}"

          if [ "$FORK_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Fork is already up to date with upstream."
            cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Upstream: ${PARENT}
          Branch: ${TARGET_BRANCH}

          Status: UP TO DATE

          The fork already matches upstream/${TARGET_BRANCH}.
          No changes were made.
          EOF

          elif [ "$MERGE_BASE" = "$UPSTREAM_SHA" ]; then
            echo "Fork contains custom commits and already includes all latest upstream commits."
            cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Upstream: ${PARENT}
          Branch: ${TARGET_BRANCH}

          Status: UP TO DATE (FORK AHEAD)

          The fork contains custom commits and already includes all latest upstream commits.
          Upstream has no new commits to merge.
          No changes were made.
          EOF

          elif [ "$MERGE_BASE" = "$FORK_SHA" ]; then
            echo "Fork is behind upstream with no custom commits. Fast-forwarding..."
            git merge --ff-only "upstream/${TARGET_BRANCH}"
            git push origin "${TARGET_BRANCH}"
            git push origin --tags 2>/dev/null || true
            NEW_FORK_SHA=$(git rev-parse HEAD)
            NEW_FORK_SHORT=$(git rev-parse --short HEAD)
            echo "Fork successfully fast-forwarded to ${NEW_FORK_SHORT}."

            echo "==> Triggering Docker image build workflow..."
            gh workflow run docker-publish.yml --ref "${TARGET_BRANCH}" || echo "Warning: Could not trigger docker-publish.yml"

            cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Upstream: ${PARENT}
          Branch: ${TARGET_BRANCH}

          Status: SYNCED (FAST-FORWARD)

          Previous fork commit: ${FORK_SHORT}
          New fork commit: ${NEW_FORK_SHORT}

          Upstream contained new commits.
          Fork successfully fast-forwarded.
          EOF

          else
            echo "Fork and upstream have diverged. Attempting merge..."
            
            # Function to auto-resolve known fork conflict points
            auto_resolve_conflicts() {
              echo "==> Running automated smart conflict resolution..."
              
              # 1. Handle Dockerfile and config protected by our fork
              git checkout HEAD -- Dockerfile Dockerfile.goreleaser config/glance.yml 2>/dev/null || true
              
              # 2. Handle page.html accessible pages
              if git diff --name-only --diff-filter=U | grep -q "internal/glance/templates/page.html"; then
                sed -i 's/{{ range \.App\.Config\.Pages }}/{{ range \$.AccessiblePages }}/g' internal/glance/templates/page.html 2>/dev/null || true
                sed -i '/<<<<<<< HEAD/d;/=======/d;/>>>>>>> upstream\/main/d' internal/glance/templates/page.html 2>/dev/null || true
                git add internal/glance/templates/page.html 2>/dev/null || true
              fi

              # 3. Handle go.mod / go.sum
              if git diff --name-only --diff-filter=U | grep -q -E "go.mod|go.sum"; then
                if [ -f go.mod ]; then
                  sed -i '/<<<<<<< HEAD/d;/=======/d;/>>>>>>> upstream\/main/d' go.mod 2>/dev/null || true
                  sed -i 's/go 1\.27\.[1-9]/go 1.27.0/g' go.mod 2>/dev/null || true
                fi
                go mod tidy 2>/dev/null || true
                git add go.mod go.sum 2>/dev/null || true
              fi

              # 4. Handle login.js
              if git diff --name-only --diff-filter=U | grep -q "internal/glance/static/js/login.js"; then
                sed -i '/<<<<<<< HEAD/d;/=======/d;/>>>>>>> upstream\/main/d' internal/glance/static/js/login.js 2>/dev/null || true
                git add internal/glance/static/js/login.js 2>/dev/null || true
              fi

              # 5. Handle config-fields.go
              if git diff --name-only --diff-filter=U | grep -q "internal/glance/config-fields.go"; then
                sed -i '/<<<<<<< HEAD/d;/=======/d;/>>>>>>> upstream\/main/d' internal/glance/config-fields.go 2>/dev/null || true
                git add internal/glance/config-fields.go 2>/dev/null || true
              fi

              # 6. Handle cli.go
              if git diff --name-only --diff-filter=U | grep -q "internal/glance/cli.go"; then
                git checkout "upstream/${TARGET_BRANCH}" -- internal/glance/cli.go 2>/dev/null || true
                git add internal/glance/cli.go 2>/dev/null || true
              fi
            }

            MERGE_SUCCESS=false
            if git merge --no-edit -m "Merge upstream/${TARGET_BRANCH} into ${TARGET_BRANCH}" "upstream/${TARGET_BRANCH}"; then
              # Validate build even on clean merge to prevent broken upstream commits
              if go build -v .; then
                MERGE_SUCCESS=true
              else
                echo "Clean merge failed compilation check."
                MERGE_SUCCESS=false
              fi
            else
              auto_resolve_conflicts
              
              # Check if any unresolved conflicts remain
              REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U || true)
              if [ -z "$REMAINING_CONFLICTS" ]; then
                if go build -v .; then
                  git commit -m "Merge upstream/${TARGET_BRANCH} into ${TARGET_BRANCH} (auto-resolved)" || true
                  MERGE_SUCCESS=true
                else
                  echo "Build verification failed after conflict auto-resolution."
                  MERGE_SUCCESS=false
                fi
              else
                MERGE_SUCCESS=false
              fi
            fi

            if [ "$MERGE_SUCCESS" = "true" ]; then
              echo "Merge succeeded and verified. Pushing to origin/${TARGET_BRANCH}..."
              git push origin "${TARGET_BRANCH}"
              git push origin --tags 2>/dev/null || true
              NEW_FORK_SHA=$(git rev-parse HEAD)
              NEW_FORK_SHORT=$(git rev-parse --short HEAD)
              echo "Merge successfully pushed. New commit: ${NEW_FORK_SHORT}."

              echo "==> Triggering Docker image build workflow..."
              gh workflow run docker-publish.yml --ref "${TARGET_BRANCH}" || echo "Warning: Could not trigger docker-publish.yml"

              cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Upstream: ${PARENT}
          Branch: ${TARGET_BRANCH}

          Status: SYNCED (AUTO-MERGED)

          Previous fork commit: ${FORK_SHORT}
          Upstream commit: ${UPSTREAM_SHORT}
          New merge commit: ${NEW_FORK_SHORT}

          Upstream changes were automatically merged and verified with zero build regressions.
          EOF

            else
              echo "::warning::Merge conflicts require human review. Preparing sync branch and PR..."
              CONFLICTED_FILES=$(git diff --name-only --diff-filter=U || echo "build failure")
              git merge --abort || true

              SYNC_BRANCH="sync/upstream-${UPSTREAM_SHORT}"
              git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"
              git merge --no-edit -m "Merge upstream/${TARGET_BRANCH} into ${SYNC_BRANCH}" "upstream/${TARGET_BRANCH}" || true

              # Check if PR already exists to avoid redundant noise
              EXISTING_PR=$(gh pr list --head "${SYNC_BRANCH}" --json number -q '.[0].number' || echo "")
              if [ -z "$EXISTING_PR" ]; then
                git push origin "${SYNC_BRANCH}" --force || true
                PR_URL=$(gh pr create --title "chore(sync): merge upstream/${TARGET_BRANCH} (${UPSTREAM_SHORT})" \
                  --body "Upstream parent has new commits (${UPSTREAM_SHORT}) with conflicts in:
          \`\`\`text
          ${CONFLICTED_FILES}
          \`\`\`
          Please review and merge." \
                  --head "${SYNC_BRANCH}" \
                  --base "${TARGET_BRANCH}" || echo "")
                echo "Opened sync PR: ${PR_URL}"
              else
                echo "Sync PR #${EXISTING_PR} is already open for this upstream commit."
              fi

              cat <<EOF >> "$SUMMARY_FILE"
          ## Upstream Sync

          Repository: ${REPO}
          Upstream: ${PARENT}
          Branch: ${TARGET_BRANCH}

          Status: PENDING REVIEW (SYNC PR OPEN)

          Upstream commits (${UPSTREAM_SHORT}) require manual conflict resolution.
          A dedicated sync branch \`${SYNC_BRANCH}\` has been created with an open PR so your main branch remains healthy.
          EOF
            fi
          fi
